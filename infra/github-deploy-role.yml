AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC role for publishing a static website.

Parameters:
  GitHubSubject:
    Type: String
    MinLength: 10
    Description: >-
      Exact token.actions.githubusercontent.com subject allowed to assume the
      role. Example: repo:owner/repository:ref:refs/heads/main

  SiteBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63

  DistributionId:
    Type: String
    MinLength: 5

  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      Existing GitHub OIDC provider ARN. Leave empty to create the provider in
      this stack.

  RoleName:
    Type: String
    Default: city-pop-github-deploy
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Scoped GitHub Actions role for static-site publishing.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubOidc
            Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Ref GitHubSubject
      Policies:
        - PolicyName: PublishStaticWebsite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListSiteBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucketName}"

              - Sid: ManageSiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucketName}/*"

              - Sid: InvalidateSiteDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}

Outputs:
  DeployRoleArn:
    Description: Store this value as the GitHub repository variable AWS_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn

  GitHubSubject:
    Description: Exact GitHub OIDC subject trusted by the role.
    Value: !Ref GitHubSubject
