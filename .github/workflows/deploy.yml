name: Deploy production

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  SITE_BUCKET_NAME: ${{ vars.SITE_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Validate repository configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${AWS_REGION:?Set the repository variable AWS_REGION}"
          : "${AWS_ROLE_ARN:?Set the repository variable AWS_ROLE_ARN}"
          : "${SITE_BUCKET_NAME:?Set the repository variable SITE_BUCKET_NAME}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Set CLOUDFRONT_DISTRIBUTION_ID}"

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Build, publish and verify
        shell: bash
        env:
          SKIP_INFRA: "1"
          WAIT_INVALIDATION: "1"
          SMOKE_TEST: "1"
        run: ./scripts/deploy-auto.sh

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Bucket: \`${SITE_BUCKET_NAME}\`"
            echo "- Distribution: \`${CLOUDFRONT_DISTRIBUTION_ID}\`"
            echo "- Region: \`${AWS_REGION}\`"
            if [[ -n "${SITE_URL}" ]]; then
              echo "- URL: ${SITE_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
